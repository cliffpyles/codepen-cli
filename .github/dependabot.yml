version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x pins typescript <6.1; lift once it supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The init, analyze and upload-sarif steps must share one version, or
      # CodeQL fails; bump them in a single PR.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
    commit-message:
      prefix: ci
