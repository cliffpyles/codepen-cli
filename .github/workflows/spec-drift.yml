# Fails when CodePen's published OpenAPI spec, YAML or JSON, differs from the copies in specs/upstream/. CodePen does
# not version it, so comparing is the only way to notice a change. A failure here means "run
# npm run spec:pull"; it must never block merging or releasing, so do not make this a required check.
name: Spec drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            specs/package-lock.json
      - run: npm ci
      - run: npm --prefix specs ci
      - run: npm --prefix specs run pull:check
