# OpenAPI description of the public v2 REST API (cpengine/server/apiv2rest.go).
# Not generated: edit it directly. Its shapes match the contract snapshot in
# cpgo/docs/publicapi/publicapi-contract.txt and the prose reference in
# cpgo/docs/publicapi/publicapi-rest.md. Change all three together.
openapi: 3.1.1
info:
  title: CodePen API
  version: '2'
  summary: Read and write Pens, their files, versions, builds and deployments, Collections and Assets.
  description: |
    The v2 REST API on `api.codepen.io`: JSON over HTTP with snake_case keys.

    CodePen also has a **GraphQL API** with the same operations at
    `POST /v2/graphql`. Both run the same logic and take the same keys, so
    use whichever suits your client. See the
    [GraphQL API docs](https://blog.codepen.io/docs/api/api-v2/graphql-api-v2/).

    Every request carries an API key, as `Authorization: Bearer cp_user_...`
    or `X-API-Key: cp_user_...`. A key belongs to a User (`cp_user_`) or a Team
    (`cp_team_`), and everything it lists, reads, creates or changes belongs to
    that key owner. Another User's or Team's Pen or Collection is not found,
    even when it is public.

    Conventions:

    - Enum values are accepted in any case in requests; responses use the
      PascalCase spelling shown here.
    - Timestamps are RFC 3339 in UTC. Ids are the ids in CodePen URLs.
    - Write endpoints take a JSON body, or `multipart/form-data` when they
      upload files. Unknown keys are ignored. A JSON body is capped at 16 MB,
      a multipart request at 120 MB and one file at 30 MB.
    - Endpoints that create answer `201`; endpoints that remove something and
      have nothing to return answer `204`.
    - Lists are JSON arrays paged with `page` and `per_page` and a `Link`
      header, the way GitHub's REST API pages.

    Errors are `{ "message", "code" }` with recovery fields beside the code
    when they apply. No `Retry-After` or rate-limit headers are sent; a
    `RATE_LIMITED` body carries `retry_after_seconds`, `limit` and `reset_at`
    instead.

    The frozen, read-only v1 API (`/v1/pens/:id` and
    `/v1/collections/:id/pens`) is not described here; see
    https://blog.codepen.io/docs/api/rest-api-v1/.
  contact:
    name: CodePen Support
    url: https://codepen.io/support
servers:
  - url: https://api.codepen.io
security:
  - bearerKey: []
  - headerKey: []
tags:
  - name: Pens
  - name: Files
    description: |
      A Pen's source files, written as one saved version per request and built
      by the compiler. A Pen made in the classic editor has files that can be
      read but not written.
  - name: Versions
  - name: Builds
    description: |
      Every write saves the caller's files as a version and builds it. When the
      compiler needs the files to change before it can build them, the API
      applies those changes, builds again and saves the result as one more
      version. Writes wait for the build (`wait`, default 45 seconds, at most
      75, `0` to answer as soon as the files are saved); a build still running
      afterwards is polled at `GET /v2/builds/{id}`.
  - name: Deployments
  - name: Domains
  - name: Settings
  - name: Collaborators
  - name: Collections
  - name: Assets
  - name: Trash
paths:
  /v2/pens:
    get:
      operationId: pens
      tags: [Pens]
      summary: List Pens
      description: |
        The key owner's Pens, filtered. Every filter given must match.

        With `block`, a request scans at most 500 candidate Pens: the `Link`
        header has `first` and, while candidates remain, `next` with a
        `cursor`, but no `last`. Follow `next` until it is absent, even when
        the page is empty or `X-CodePen-Partial` is `true`.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/sortPens'
        - $ref: '#/components/parameters/direction'
        - name: access
          in: query
          description: Comma list of `Public`, `Private`, `Protected` and `Collaborators`.
          schema:
            type: string
        - name: deployed
          in: query
          description: '`true` for Pens with a live deployment, `false` for Pens without one.'
          schema:
            type: boolean
        - name: template
          in: query
          description: '`true` for Pens marked as templates, `false` for the rest.'
          schema:
            type: boolean
        - name: forks
          in: query
          description: '`Forked` for forks only, `NotForked` for Pens that are not forks.'
          schema:
            type: string
            enum: [All, Forked, NotForked]
            default: All
        - name: editor
          in: query
          description: '`V2`, or `Classic` for Pens made in the classic editor.'
          schema:
            type: string
            enum: [V2, Classic]
        - name: tags
          in: query
          description: |
            Comma list of up to three tags; a Pen tagged with any of them
            matches. Tags are matched the way they are saved: lowercased,
            spaces as dashes, punctuation dropped.
          schema:
            type: string
        - name: search_term
          in: query
          description: |
            Matches the title or description, up to 200 characters. Every word
            has to appear, `"quoted words"` stay together and `-word` excludes
            one.
          schema:
            type: string
            maxLength: 200
        - name: created_since
          in: query
          description: 'Pens created since this time (RFC 3339).'
          schema:
            type: string
            format: date-time
        - name: created_until
          in: query
          description: 'Pens created until this time (RFC 3339).'
          schema:
            type: string
            format: date-time
        - name: updated_since
          in: query
          description: 'Pens updated since this time (RFC 3339).'
          schema:
            type: string
            format: date-time
        - name: updated_until
          in: query
          description: 'Pens updated until this time (RFC 3339).'
          schema:
            type: string
            format: date-time
        - name: untitled
          in: query
          description: '`true` for Pens with no title.'
          schema:
            type: boolean
        - name: block
          in: query
          description: |
            Pens whose saved head uses this Block, such as `sass-1`. A capped
            scan; see the operation description.
          schema:
            type: string
        - name: cursor
          in: query
          description: |
            With `block` only: the cursor from the `next` link. Not combined
            with `page`.
          schema:
            type: string
      responses:
        '200':
          description: A page of Pens.
          headers:
            Link:
              $ref: '#/components/headers/Link'
            X-CodePen-Partial:
              $ref: '#/components/headers/X-CodePen-Partial'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      operationId: penCreate
      tags: [Pens]
      summary: Create a Pen
      description: |
        Starter files when `files` is omitted; `.codepen/pen.config.json` is
        added when the caller does not supply one. The title defaults to
        "Untitled" and `access` to the key owner's default privacy. Anything
        but `Public` needs a PRO plan.

        The answer is the Pen with the first version's `build`; `wait` in the
        body or the query bounds how long the request waits for it.
      parameters:
        - $ref: '#/components/parameters/wait'
      requestBody:
        description: "The Pen's metadata and files as JSON, or a multipart form whose `pen` part is that JSON and whose other parts are files. Optional; an empty body makes an Untitled Pen with starter files."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenCreateRequest'
          multipart/form-data:
            schema:
              type: object
              description: |
                `pen` is the JSON body. Every other part is one uploaded file,
                named by its path in the Pen (`/img/logo.png`).
              properties:
                pen:
                  $ref: '#/components/schemas/PenCreateRequest'
              additionalProperties:
                $ref: '#/components/schemas/Upload'
            encoding:
              pen:
                contentType: application/json
      responses:
        '201':
          description: The new Pen, with `build`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v2/pens/{id}:
    parameters:
      - $ref: '#/components/parameters/penId'
    get:
      operationId: pen
      tags: [Pens]
      summary: Get a Pen
      description: "One of the key owner's Pens, whatever its access. A Pen made in the classic editor reads like any other."
      responses:
        '200':
          description: The Pen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pen'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      operationId: penUpdate
      tags: [Pens]
      summary: Update a Pen
      description: |
        Only the keys given change; an empty body returns the Pen unchanged.
        The metadata is saved first and the access change second, so a refused
        access change leaves the metadata saved.
      requestBody:
        description: 'The keys to change.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenUpdateRequest'
      responses:
        '200':
          description: The Pen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: penDelete
      tags: [Pens]
      summary: Move a Pen to the trash
      description: |
        The Pen is listed under Deleted Items on the site and in
        `GET /v2/trash`, and can be restored for three days.
      responses:
        '204':
          description: Moved to the trash.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v2/pens/{id}/fork:
    parameters:
      - $ref: '#/components/parameters/penId'
    post:
      operationId: penFork
      tags: [Pens]
      summary: Fork a Pen
      description: |
        Copies one of the key owner's Pens. The copy keeps the original's
        title, description, tags and access unless given; a fork of a
        Protected Pen needs a `password`.
      parameters:
        - $ref: '#/components/parameters/wait'
      requestBody:
        description: 'What to change on the copy. Optional.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenForkRequest'
      responses:
        '201':
          description: The new Pen, with `build`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v2/pens/{id}/files:
    parameters:
      - $ref: '#/components/parameters/penId'
    get:
      operationId: penFiles
      tags: [Files]
      summary: List a Pen's files
      description: The files of the saved head, with `content`.
      responses:
        '200':
          description: The files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      operationId: penFilesWrite
      tags: [Files]
      summary: Write files as one version
      description: |
        Applies `files` changes, in order, as one saved version and builds it.
        Each change addresses a file by `path` or `id`:

        | Change | Effect |
        | --- | --- |
        | `{ path, content }` | Writes the file at `path`, creating it if needed. |
        | `{ id, content }` | Writes the file with that id, wherever it is. |
        | `{ id, path }` | Moves the file to `path`; it keeps its id. Add `content` to write there too. |
        | `{ path, delete: true }` | Deletes the file, or every file under a directory path. |
        | `{ id, delete: true }` | Deletes the file with that id. |

        Binary files go up as parts of a multipart form, each one more change
        applied after those in `changes`.
      parameters:
        - $ref: '#/components/parameters/wait'
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        description: 'The changes as JSON, or a multipart form whose `changes` part is that JSON and whose other parts are files.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilesWriteRequest'
          multipart/form-data:
            schema:
              type: object
              description: |
                `changes` is the JSON body. Every other part is one uploaded
                file, named by its path in the Pen.
              properties:
                changes:
                  $ref: '#/components/schemas/FilesWriteRequest'
                expected_version_id:
                  type: string
              additionalProperties:
                $ref: '#/components/schemas/Upload'
            encoding:
              changes:
                contentType: application/json
      responses:
        '200':
          $ref: '#/components/responses/FilesWrite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '504':
          $ref: '#/components/responses/BuildTimeout'
    patch:
      operationId: penFilesEdit
      tags: [Files]
      summary: Edit files with hunks
      description: |
        Changes text files without resending them. Each hunk names a file and
        replaces `old`, text that appears in it exactly once, with `new`. Hunks
        are applied in order, each against the result of the ones before it,
        and every file they touch is written as one saved version.

        A hunk whose `old` matches nowhere byte for byte, but matches exactly
        one run of whole lines once leading indentation is ignored, is applied
        to those lines and `new` is re-indented to match.

        Nothing is applied by halves: one hunk that cannot be applied fails the
        whole write with `400 BAD_USER_INPUT`, `field` `edits`, and
        `details.misses` listing every miss (`index`, `path`, `reason` of
        `NotFound`, `Ambiguous` or `NoSuchFile`, and `matches`, `lines` or
        `nearest` to retry with). A set of hunks that changes nothing is
        refused.
      parameters:
        - $ref: '#/components/parameters/wait'
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        description: 'The hunks to apply.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilesEditRequest'
      responses:
        '200':
          $ref: '#/components/responses/FilesWrite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '504':
          $ref: '#/components/responses/BuildTimeout'

  /v2/pens/{id}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/penId'
      - $ref: '#/components/parameters/filePath'
    get:
      operationId: penFile
      tags: [Files]
      summary: Get one file
      description: One file of the saved head, with `content` and `url`. Paths match without regard to case.
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      operationId: penFileWrite
      tags: [Files]
      summary: Write one file
      description: Writes text `content` as JSON, or a multipart `file` part, at `path` as one saved version.
      parameters:
        - $ref: '#/components/parameters/wait'
        - $ref: '#/components/parameters/dry_run'
      requestBody:
        description: 'Text `content` as JSON, or a multipart `file` part.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWriteRequest'
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  $ref: '#/components/schemas/Upload'
                expected_version_id:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/FilesWrite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '504':
          $ref: '#/components/responses/BuildTimeout'
    delete:
      operationId: penFileDelete
      tags: [Files]
      summary: Delete one file or a directory
      description: |
        A directory path deletes every file under it. The answer is the new
        version, not `204`. Deleting by id goes through `PUT /v2/pens/{id}/files`
        with `{ "id": "...", "delete": true }`.
      parameters:
        - $ref: '#/components/parameters/wait'
        - $ref: '#/components/parameters/dry_run'
        - $ref: '#/components/parameters/expected_version_id'
      responses:
        '200':
          $ref: '#/components/responses/FilesWrite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '504':
          $ref: '#/components/responses/BuildTimeout'

  /v2/pens/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/penId'
    get:
      operationId: penVersions
      tags: [Versions]
      summary: List a Pen's saved versions
      description: |
        Saved versions, each with its `build` and without `files`. Versions
        never change once saved, so `updated` sorts them like `created`. A Pen
        made in the classic editor has none.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/direction'
      responses:
        '200':
          description: A page of versions.
          headers:
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v2/pens/{id}/versions/{version_id}/restore:
    parameters:
      - $ref: '#/components/parameters/penId'
      - name: version_id
        in: path
        required: true
        description: The id of the version to copy to the head.
        schema:
          type: string
    post:
      operationId: penVersionRestore
      tags: [Versions]
      summary: Restore an older version
      description: |
        Copies the version to the head. The restored version keeps the build of
        the version it copies; it is not built again.
      parameters:
        - name: label
          in: query
          description: Names the new saved version (at most 80 characters).
          schema:
            type: string
            maxLength: 80
      responses:
        '200':
          description: The Pen, whose `saved_version` is the new head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pen'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v2/versions/{id}:
    parameters:
      - $ref: '#/components/parameters/versionId'
    get:
      operationId: penVersion
      tags: [Versions]
      summary: Get a version
      description: |
        One version with its `files`, and its `build` with output files. A dry
        run's unsaved version (`saved: false`) is readable here for 36 hours.
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v2/builds/{id}:
    parameters:
      - $ref: '#/components/parameters/versionId'
    get:
      operationId: build
      tags: [Builds]
      summary: Get a build
      description: |
        A version's build, by the version's id: the write's `build.id`, or
        `build.next_id` while the API is applying the compiler's changes (that
        build is `Running` until its version is saved).
      parameters:
        - name: wait
          in: query
          description: Seconds to wait for the build to settle (at most 75). Without it the build is answered as it is.
          schema:
            type: integer
            minimum: 0
            maximum: 75
      responses:
        '200':
          description: The build, with output `files` when it succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Build'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /v2/pens/{id}/deployment:
    parameters:
      - $ref: '#/components/parameters/penId'
    put:
      operationId: penDeploy
      tags: [Deployments]
      summary: Deploy a Pen
      description: 'Deploys a saved version, the saved head unless `version_id` says otherwise, and answers the deployment.'
      requestBody:
        description: 'The version to deploy. Optional.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployRequest'
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
