components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      bearerFormat: cp_user_... or cp_team_... API key
      description: An API key from Settings → API on codepen.io.
    headerKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: The same API key, in a header of its own.

  parameters:
    penId:
      name: id
      in: path
      required: true
      description: |
        The Pen's cpid or hashid, or a CodePen URL that names the Pen (editor,
        pen or preview URL).
      schema:
        type: string
      example: 01a08738-73f0-7847-b6a8-5789d289c158
    versionId:
      name: id
      in: path
      required: true
      description: The version's id.
      schema:
        type: string
      example: 01a08738-73f0-7848-b8bf-e8e7e91b1ae2
    collectionId:
      name: id
      in: path
      required: true
      description: The Collection's hashid, the id in its URL.
      schema:
        type: string
      example: QbaoZL
    assetId:
      name: id
      in: path
      required: true
      description: The Asset's hashid.
      schema:
        type: string
      example: k7Ym0R
    filePath:
      name: path
      in: path
      required: true
      description: |
        The file's full path in the Pen, without the leading `/`. Its
        slashes may be sent as they are (`src/app.js`) or encoded
        (`src%2Fapp.js`, as OpenAPI clients encode a path parameter).
      schema:
        type: string
      example: src/app.js
    page:
      name: page
      in: query
      description: The page, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      description: Items per page. A value over 100 is reduced to 100, not refused.
      schema:
        type: integer
        minimum: 1
        default: 30
    sort:
      name: sort
      in: query
      description: 'The order: by creation or update time.'
      schema:
        type: string
        enum: [created, updated]
        default: created
    sortPopularity:
      name: sort
      in: query
      description: 'The order: by creation or update time, or by popularity.'
      schema:
        type: string
        enum: [created, updated, popularity]
        default: created
    sortPens:
      name: sort
      in: query
      description: 'The order: by creation or update time, by popularity, or by title.'
      schema:
        type: string
        enum: [created, updated, popularity, title]
        default: created
    direction:
      name: direction
      in: query
      description: '`desc`, the default, lists newest first.'
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    wait:
      name: wait
      in: query
      description: |
        Seconds to wait for the build (default 45, at most 75; `0` answers as
        soon as the files are saved). A `wait` in the JSON body takes
        precedence.
      schema:
        type: integer
        minimum: 0
        maximum: 75
    dry_run:
      name: dry_run
      in: query
      description: |
        Build the proposed files without saving them: the head does not move
        and the answer's `version` has `saved: false`. A `dry_run` in the JSON
        body takes precedence.
      schema:
        type: boolean
        default: false
    expected_version_id:
      name: expected_version_id
      in: query
      description: |
        The `saved_version.id` the change was built on. The write is refused
        with `409` if the Pen's head has moved since.
      schema:
        type: string

  headers:
    Link:
      description: |
        The other pages, as `<url>; rel="prev"`, `"next"`, `"first"` and
        `"last"`. `prev` is absent on the first page and `next` on the last.
        Follow these URLs rather than building your own; they keep the
        request's other query parameters.
      schema:
        type: string
      example: '<https://api.codepen.io/v2/pens?page=3&per_page=30>; rel="next", <https://api.codepen.io/v2/pens?page=1&per_page=30>; rel="first", <https://api.codepen.io/v2/pens?page=21&per_page=30>; rel="last"'
    X-CodePen-Partial:
      description: Sent with the `block` filter only. `true` when the scan stopped before finding a full page.
      schema:
        type: boolean

  responses:
    FilesWrite:
      description: The Pen, the newest version the write produced with its `files`, and that version's build.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FilesWriteResult'
    Collection:
      description: The Collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Collection'
    Collaborators:
      description: The collaborators.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Collaborator'
    Invites:
      description: The pending invitations.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CollaboratorInvite'
    Domains:
      description: The deployment's custom domains.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PenDomain'
    BadRequest:
      description: |
        `BAD_USER_INPUT`: an invalid parameter, body, path, setting, access
        level or role. `field` names the argument when known, and `details`
        carries structured detail (the misses of `PATCH /v2/pens/{id}/files`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: per_page must be a positive number
            code: BAD_USER_INPUT
    Unauthorized:
      description: '`UNAUTHENTICATED`: a missing or invalid key, a deleted owner, or a Team key for a Team that is not PRO.'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="codepen"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: invalid or missing API key
            code: UNAUTHENTICATED
    Forbidden:
      description: |
        `FORBIDDEN`: a write to a Pen made in the classic editor, or a plan
        limit (non-Public access, a Private Collection, file size, storage,
        collaborators). The message names the limit and, when a bigger plan
        would lift it, where to upgrade.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        `NOT_FOUND`: no such item, or one that is not the key owner's, public
        or not. A path that is not an endpoint at all answers `404` with the
        v1 body `{ "error": "not found" }` instead.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Error'
              - $ref: '#/components/schemas/RouteNotFoundError'
    Conflict:
      description: "`CONFLICT`: `expected_version_id` is no longer the Pen's head. Read the Pen again and retry."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: the Pen's head is 01a0...c5, not 01a0...99; read it again and retry
            code: CONFLICT
            expected_version_id: 01a0...99
            current_version_id: 01a0...c5
    RateLimited:
      description: |
        `RATE_LIMITED`: the owner exceeded the plan's requests in an hour, its
        reads today, or today's allowance of Pen or Collection creates. No
        `Retry-After` or rate-limit headers are sent; the body carries
        `retry_after_seconds`, `limit` and `reset_at`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'daily limit reached: the Free plan allows 3 Pens a day through the API. Upgrade to PRO for 50 a day at https://codepen.io/pricing'
            code: RATE_LIMITED
            retry_after_seconds: 51840
            limit: 3
            reset_at: '2026-10-28T09:00:00Z'
    Internal:
      description: '`INTERNAL`: unexpected, and reported; the message is generic.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BuildTimeout:
      description: |
        `BUILD_TIMEOUT`: a dry run's build did not finish inside `wait`, and
        there is no saved version to poll. Retry with a longer `wait`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    PenAccess:
      type: string
      description: |
        `Public`; `Private` (not listed on the site; anyone with the link can
        view it); `Protected` (private and password protected); `Collaborators`
        (private and for collaborators only). Anything but `Public` needs a PRO
        plan.
      enum: [Public, Private, Protected, Collaborators]
    CollectionAccess:
      type: string
      description: '`Private` needs a PRO plan.'
      enum: [Public, Private]
    Role:
      type: string
      enum: [Owner, Editor, Viewer]
    AssetFilename:
      type: string
      description: At most 191 bytes, unique among the owner's Assets, without `/` or `\`.
      maxLength: 191
    Upload:
      type: string
      description: A file's bytes, as one part of a multipart form.
      contentMediaType: application/octet-stream

    Pen:
      type: object
      required:
        - id
        - title
        - description
        - tags
        - access
        - password
        - template
        - popularity
        - views_count
        - loves_count
        - editor
        - created_at
        - updated_at
        - urls
        - screenshot_urls
        - saved_version
        - deployment
        - settings
      properties:
        id:
          type: string
          description: The cpid, or the hashid for a Pen made in the classic editor.
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        access:
          $ref: '#/components/schemas/PenAccess'
        password:
          type: [string, 'null']
          description: Write-only, so always null.
        template:
          type: boolean
        popularity:
          type: integer
        views_count:
          type: integer
          description: Views as the site shows them, tallied in batches, so it can trail by a few minutes.
        loves_count:
          type: integer
        editor:
          type: string
          description: '`V2`, or `Classic` for a Pen made in the classic editor, which is read-only through the API.'
          enum: [Classic, V2]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        urls:
          $ref: '#/components/schemas/PenUrls'
        screenshot_urls:
          description: Screenshots of the saved head; null for a Pen with no saved version.
          oneOf:
            - $ref: '#/components/schemas/ScreenshotUrls'
            - type: 'null'
        saved_version:
          description: The Pen's head, without `files`; null for a Pen made in the classic editor.
          oneOf:
            - $ref: '#/components/schemas/Version'
            - type: 'null'
        deployment:
          oneOf:
            - $ref: '#/components/schemas/Deployment'
            - type: 'null'
        settings:
          $ref: '#/components/schemas/Settings'
        build:
          description: |
            Only on `POST /v2/pens` and `POST /v2/pens/{id}/fork`: the first
            version's build, or the converged version's when the compiler asked
            for changes.
          oneOf:
            - $ref: '#/components/schemas/Build'
            - type: 'null'
    PenUrls:
      type: object
      required: [editor, preview]
      properties:
        editor:
          type: string
          format: uri
        preview:
          type: string
          format: uri
          description: |
            Renders the saved head on its own; 404s for Protected and
            Collaborators Pens, which need a browser session.
    ScreenshotUrls:
      type: object
      description: |
        JPEG screenshots of the saved head, 16:9, by width. A screenshot is
        rendered the first time it is requested, so the first fetch can take a
        few seconds.
      required: [small, medium, large, xlarge]
      properties:
        small:
          type: string
          format: uri
          description: 320 pixels wide.
        medium:
          type: string
          format: uri
          description: 512 pixels wide.
        large:
          type: string
          format: uri
          description: 800 pixels wide.
        xlarge:
          type: string
          format: uri
          description: 1280 pixels wide.
    Settings:
      type: object
      required: [auto_deploy, auto_run, auto_save, indent_with, tab_size]
      properties:
        auto_deploy:
          type: boolean
        auto_run:
          type: boolean
        auto_save:
          type: boolean
        indent_with:
          type: string
          description: '`tabs` or `spaces`.'
        tab_size:
          type: integer
          minimum: 1
          maximum: 6

    File:
      type: object
      required:
        [
          id,
          path,
          name,
          content_hash,
          is_binary,
          bytes,
          content_type,
          content,
          url
        ]
      properties:
        id:
          type: string
          description: Stable across versions, renames and edits.
        path:
          type: string
          example: /src/app.js
        name:
          type: string
          example: app.js
        content_hash:
          type: string
        is_binary:
          type: boolean
        bytes:
          type: integer
        content_type:
          type: string
          description: The media type the file is served with, from its extension.
        content:
          type: [string, 'null']
          description: Null for binary files, which are read from `url`.
        url:
          type: [string, 'null']
          format: uri
          description: Where the file is served raw; null for the files of a Pen made in the classic editor.

    Version:
      type: object
      required:
        [
          id,
          pen_id,
          hash,
          created_at,
          deployed,
          saved,
          label,
          build,
          preview_url
        ]
      properties:
        id:
          type: string
        pen_id:
          type: string
        hash:
          type: string
        created_at:
          type: string
          format: date-time
        deployed:
          type: boolean
        saved:
          type: boolean
          description: False only for a dry run's unsaved version.
        label:
          type: [string, 'null']
        build:
          oneOf:
            - $ref: '#/components/schemas/Build'
            - type: 'null'
        preview_url:
          type: [string, 'null']
          format: uri
          description: Null for a dry run's version, or when the key cannot read the Pen.
        files:
          type: array
          description: The version's source files; only on `GET /v2/versions/{id}` and the file writes.
          items:
            $ref: '#/components/schemas/File'

    Build:
      type: object
      required:
        - id
        - status
        - started_at
        - ended_at
        - rounds
        - diagnostics
        - errors
        - applied_patches
        - patches
        - version_id
        - next_id
        - previous_id
      properties:
        id:
          type: string
          description: The version's id, before and after the version is saved.
        status:
          type: string
          description: '`Canceled` means changes are still required; see `patches` and `next_id`.'
          enum: [Queued, Running, Success, Failed, Canceled]
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        rounds:
          type: integer
          description: How many compiler builds it took, counted from the version the caller wrote.
        diagnostics:
          type: array
          description: Every diagnostic of the final build.
          items:
            $ref: '#/components/schemas/BuildDiagnostic'
        errors:
          type: array
          description: The diagnostics with `type` `Error`.
          items:
            $ref: '#/components/schemas/BuildDiagnostic'
        applied_patches:
          type: array
          description: Changes the API applied to the caller's files on the compiler's behalf.
          items:
            $ref: '#/components/schemas/BuildPatch'
        patches:
          type: array
          description: Changes the compiler still requires.
          items:
            $ref: '#/components/schemas/BuildPatch'
        files:
          type: array
          description: |
            The compiled output served under the version's `preview_url`. On
            the single version and build endpoints and the writes, and only
            when the build succeeded.
          items:
            $ref: '#/components/schemas/File'
        version_id:
          type: [string, 'null']
          description: Null while the version is still being converged.
        next_id:
          type: [string, 'null']
          description: The build applying this one's patches.
        previous_id:
          type: [string, 'null']
          description: The caller's build this one was converged from.
    BuildDiagnostic:
      type: object
      required:
        [type, scope, message, code, url, block_name, path, file_id, range]
      properties:
        type:
          type: string
          enum: [Error, Warning, Information, Hint, Patch]
        scope:
          type: string
          enum: [Build, BuildStep, File]
        message:
          type: string
        code:
          type: [string, 'null']
        url:
          type: [string, 'null']
        block_name:
          type: [string, 'null']
        path:
          type: [string, 'null']
        file_id:
          type: [string, 'null']
        range:
          oneOf:
            - $ref: '#/components/schemas/FileRange'
            - type: 'null'
    FileRange:
      type: object
      required: [start, end]
      properties:
        start:
          $ref: '#/components/schemas/FileLocation'
        end:
          oneOf:
            - $ref: '#/components/schemas/FileLocation'
            - type: 'null'
    FileLocation:
      type: object
      required: [line, column, position]
      properties:
        line:
          type: integer
        column:
          type: integer
        position:
          type: [integer, 'null']
    BuildPatch:
      type: object
      required: [type, path, file_id, content]
      properties:
        type:
          type: string
          description: '`create`, `update` or `delete`.'
        path:
          type: string
        file_id:
          type: [string, 'null']
          description: Set for `update` and `delete`.
        content:
          type: [string, 'null']
          description: Set for `create` and `update`.

    FilesWriteResult:
      type: object
      required: [pen, version, build]
      properties:
        pen:
          oneOf:
            - $ref: '#/components/schemas/Pen'
            - type: 'null'
        version:
          oneOf:
            - $ref: '#/components/schemas/Version'
            - type: 'null'
        build:
          oneOf:
            - $ref: '#/components/schemas/Build'
            - type: 'null'

    Deployment:
      type: object
      required: [id, version_id, url, custom_domains, created_at, updated_at]
      properties:
        id:
          type: string
        version_id:
          type: string
        url:
          type: string
          format: uri
        custom_domains:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PenDomain:
      type: object
      required: [id, host, status, dns, cname_record, a_record, created_at]
      properties:
        id:
          type: string
        host:
          type: string
        status:
          type: string
          enum: [Pending, Verified, Misconfigured]
        dns:
          type: array
          description: The records to create for the host to verify.
          items:
            $ref: '#/components/schemas/DnsRecord'
        cname_record:
          type: string
          description: What the last lookup found for the CNAME record, such as `None`, `Valid`, `Legacy` or `Invalid`.
        a_record:
          type: string
          description: What the last lookup found for the A record, such as `None`, `Valid`, `Legacy` or `Invalid`.
        created_at:
          type: string
          format: date-time
    DnsRecord:
      type: object
      required: [type, name, value]
      properties:
        type:
          type: string
          example: CNAME
        name:
          type: string
          example: www
        value:
          type: string
          example: custom.codepen.app

    Collaborator:
      type: object
      required: [username, name, role, is_team_member]
      properties:
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        is_team_member:
          type: boolean
    CollaboratorInvite:
      type: object
      description: One of `email` and `username` is set.
      required: [id, email, username, role, created_at]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        username:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time

    Collection:
      type: object
      required:
        [
          id,
          title,
          description,
          access,
          items_count,
          popularity,
          created_at,
          updated_at,
          url
        ]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        access:
          $ref: '#/components/schemas/CollectionAccess'
        items_count:
          type: integer
        popularity:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri

    Asset:
      type: object
      required: [id, filename, url, is_binary, created_at, updated_at]
      properties:
        id:
          type: string
        filename:
          type: string
        url:
          type: string
          format: uri
        is_binary:
          type: boolean
          description: |
            Text Assets are those with a text extension: SVG,
            HTML/HAML/Pug/Slim/Markdown, CSS/Sass/SCSS/Less/Stylus,
            JS/JSX/TS/TSX/CoffeeScript/JSON/source maps, Vue, GLSL and plain
            text. Everything else is binary.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssetWithContent:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          required: [content]
          properties:
            content:
              type: [string, 'null']
              description: A text Asset's content; null for a binary one, whose bytes are served at `url`.

    TrashItem:
      type: object
      required: [id, type, item_id, title, deleted_at, expires_at]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [Pen, Collection]
        item_id:
          type: string
          description: The Pen's or Collection's id, for the restore endpoints.
        title:
          type: string
        deleted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - BAD_USER_INPUT
            - BUILD_TIMEOUT
            - CONFLICT
            - FORBIDDEN
            - INTERNAL
            - NOT_FOUND
            - RATE_LIMITED
            - UNAUTHENTICATED
        field:
          type: string
          description: On `BAD_USER_INPUT`, the argument it is about, when known.
        details:
          type: object
          description: On `BAD_USER_INPUT`, structured detail about it, such as the `misses` of a hunk edit.
        expected_version_id:
          type: string
          description: On `CONFLICT`.
        current_version_id:
          type: string
          description: On `CONFLICT`.
        retry_after_seconds:
          type: integer
          description: On `RATE_LIMITED`, seconds until the counter resets.
        limit:
          type: integer
          description: On `RATE_LIMITED`, the allowance.
        reset_at:
          type: [string, 'null']
          format: date-time
          description: On `RATE_LIMITED`, when the counter resets, when known.
        build_id:
          type: string
          description: On `BUILD_TIMEOUT`, the build to poll when it has an id.
    RouteNotFoundError:
      type: object
      description: The v1 error body, answered for a path that is not an endpoint.
      required: [error]
      properties:
        error:
          type: string
          example: not found

    PenFileRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
          example: index.html
        content:
          type: string
          description: Text only; binary files go up as multipart parts.
    PenCreateRequest:
      type: object
      properties:
        title:
          type: string
          default: Untitled
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        access:
          $ref: '#/components/schemas/PenAccess'
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: Required with `Protected` access, and refused with any other.
        template:
          type: boolean
        files:
          type: array
          description: Starter files when omitted.
          items:
            $ref: '#/components/schemas/PenFileRequest'
        wait:
          $ref: '#/components/schemas/Wait'
    PenUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          description: Replaces the whole list.
          items:
            type: string
        template:
          type: boolean
        access:
          $ref: '#/components/schemas/PenAccess'
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: |
            Required when changing to `Protected`. On a Pen that is already
            Protected, `password` alone replaces the password.
    PenForkRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        access:
          $ref: '#/components/schemas/PenAccess'
        password:
          type: string
          writeOnly: true
          minLength: 8
        wait:
          $ref: '#/components/schemas/Wait'
    Wait:
      type: integer
      description: Seconds to wait for the build (default 45, at most 75; `0` answers as soon as the files are saved).
      minimum: 0
      maximum: 75
    WriteOptions:
      type: object
      properties:
        expected_version_id:
          type: string
          description: |
            The `saved_version.id` the change was built on. The write is refused
            with `409` if the Pen's head has moved since.
        wait:
          $ref: '#/components/schemas/Wait'
        dry_run:
          type: boolean
          default: false
          description: |
            Build the proposed files without saving them. The head does not
            move, and the answer's `version` has `saved: false`; it stays
            readable at `GET /v2/versions/{id}` for 36 hours.
    FileChange:
      type: object
      description: Addresses a file by `path` or `id`; see the operation's table.
      properties:
        id:
          type: string
        path:
          type: string
        content:
          type: string
        delete:
          type: boolean
    FilesWriteRequest:
      allOf:
        - $ref: '#/components/schemas/WriteOptions'
        - type: object
          properties:
            files:
              type: array
              items:
                $ref: '#/components/schemas/FileChange'
            label:
              type: string
              maxLength: 80
              description: Names the saved version.
    FileEdit:
      type: object
      required: [old, new]
      properties:
        id:
          type: string
          description: The file, by id. One of `id` and `path`. Text files only.
        path:
          type: string
          description: The file, by full path. One of `id` and `path`.
        old:
          type: string
          minLength: 1
          description: Text that appears in the file exactly once, byte for byte.
        new:
          type: string
          description: The replacement. An empty string deletes the matched text.
        replace_all:
          type: boolean
          description: Replace every occurrence of `old` instead of requiring exactly one.
    FilesEditRequest:
      allOf:
        - $ref: '#/components/schemas/WriteOptions'
        - type: object
          required: [edits]
          properties:
            edits:
              type: array
              items:
                $ref: '#/components/schemas/FileEdit'
            label:
              type: string
              maxLength: 80
              description: Names the saved version.
    FileWriteRequest:
      allOf:
        - $ref: '#/components/schemas/WriteOptions'
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: Text only; send a binary file as a multipart `file` part.
    DeployRequest:
      type: object
      properties:
        version_id:
          type: string
          description: The version to deploy; the saved head when omitted.
    DomainAddRequest:
      type: object
      required: [host]
      properties:
        host:
          type: string
          example: www.example.com
    SettingsUpdateRequest:
      type: object
      properties:
        auto_deploy:
          type: boolean
        auto_run:
          type: boolean
        auto_save:
          type: boolean
        indent_with:
          type: string
          enum: [tabs, spaces]
        tab_size:
          type: integer
          minimum: 1
          maximum: 6
    CollaboratorInviteRequest:
      type: object
      required: [email_or_username, role]
      properties:
        email_or_username:
          type: string
        role:
          type: string
          enum: [Editor, Viewer]
    RoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [Editor, Viewer]
    CollectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/CollectionRequest'
        - type: object
          required: [title]
    CollectionRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        access:
          $ref: '#/components/schemas/CollectionAccess'
    AssetRequest:
      type: object
      properties:
        filename:
          $ref: '#/components/schemas/AssetFilename'
        content:
          type: string
          description: Text Assets only; send binary files as a multipart `file` part.
