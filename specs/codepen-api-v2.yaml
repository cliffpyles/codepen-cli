openapi: 3.2.0
# Written against OpenAPI 3.2.0 but uses only features that also exist in 3.1, so tools
# that stop at 3.1 can read it by changing this one line.

info:
  title: CodePen REST API v2
  version: '2026-10-02'
  summary: Read and write your own CodePen Pens, Collections and Assets over plain JSON and HTTP.
  description: |
    The REST surface of the CodePen API v2. It offers the same operations as the GraphQL API v2
    (`POST https://api.codepen.io/v2/graphql`, not described here); both run the same logic, so a
    change made through one is visible through the other. Keys, scope, limits and error codes are
    shared.

    `info.version` is the date of the newest docs revision this document was written from
    (API v2 page: 2026-10-02; REST API v2 page: 2026-10-01). The API itself is versioned by the
    `/v2` in its base URL.

    ## Access and scope

    A key belongs to a User (`cp_user_…`) or a Team (`cp_team_…`) and works only with that owner's
    own Pens, Collections and Assets, whatever their privacy. Other people's work is never
    reachable, even when public and even for collaborators: requesting it answers `404 NOT_FOUND`,
    exactly like an ID that does not exist. Listing a Collection returns only the key owner's Pens in
    it. There is no endpoint for the key owner; every list is theirs.

    A Team's key works only while the Team is PRO, and writes made with it are attributed to the
    Team's owner. One key exists per owner at a time; rotating it in Settings → API invalidates the
    old one immediately.

    ## Classic Pens and 2.0 Pens

    Every Pen says which editor made it: `editor` is `V2` or `Classic`. A 2.0 Pen has files, saved
    versions, builds and deployments, all readable and writable. A Classic Pen is read-only: it reads
    as a set of files named for its panels' preprocessors (`/index.html`, `/style.scss`,
    `/script.js`…), has no versions and no deployment, and answers `403 FORBIDDEN` to writes. Classic
    Pens can still be added to and removed from Collections.

    ## Identifiers

    | Thing | ID |
    | :--- | :--- |
    | Pen | Its cpid (2.0 Pens, a UUID) or its hashid (the slug in a Classic Pen's URL). Either works for any Pen. |
    | Pen file | A stable ID assigned when the file is created. It survives renames and edits. |
    | Pen version | Its cpid. |
    | Build | The ID of the version it built. A version and its build share one ID. |
    | Deployment | A hashid. |
    | Collection | Its hashid, the ID in `codepen.io/collection/<id>`. |
    | Asset | Its hashid. |

    ## Conventions

    - Keys are snake_case in requests and responses.
    - Enum values are accepted in any case and returned in PascalCase. The request schemas list the
      PascalCase spelling only.
    - Unknown request keys are ignored by the server. The request schemas here are closed anyway, so
      a misspelled key is caught by validation instead of being silently dropped.
    - Timestamps are RFC 3339 in UTC.
    - Write endpoints take a JSON body, or `multipart/form-data` when they upload files. Responses are
      JSON objects, or JSON arrays for lists. Creates answer `201`; removals with nothing to return
      answer `204`.

    ## Writes and builds

    Pens are compiled. Every write to a 2.0 Pen's files (creating, forking, writing, moving or
    deleting files) saves a new version and builds it, like pushing a commit to a repository with CI.
    The compiler may ask for changes (*patches*): adding `/tsconfig.json`, adding `type="module"` to a
    `<script>` tag, adding a dependency to `package.json`, syncing the Pen's config file, or
    formatting on save. The API applies them, rebuilds, and saves the result as one more version
    (at most five builds). So a write makes one version, or two:

    1. The version holding exactly the files you sent. Its build ends `Canceled` with `next_id` set.
    2. The version with the patches applied. It becomes the head; its build lists `applied_patches`
       and its `previous_id` points back to the first.

    A write waits for its build before answering: `wait` seconds, 45 by default, at most 75, or 0 to
    answer as soon as the files are saved. The build carries on either way. Before writing to the
    same Pen again:

    1. Wait until the build is settled, following `next_id` through `GET /builds/{id}`. A build is
       settled when its status is `Success` or `Failed`, or `Canceled` with no `next_id`.
    2. Read the files again (`GET /pens/{id}/files`, or `GET /versions/{id}` with the settled
       build's `version_id`). Never reuse your own copy of what you sent.
    3. Send that version's ID as `expected_version_id`, so a write based on stale files is refused
       with `409 CONFLICT` instead of saved over newer ones.

    If someone has the Pen open in the editor when the API saves, their tab goes read-only and asks
    them to refresh. The API's write always goes through.

    A failed build is not an error response: the write answers `200` (or `201`) with the files
    saved and `build.status` `Failed`. Restoring a version is the one write that does not build; the
    restored version keeps the build of the version it copied.

    ## Source files and output files

    - A version's `files` are the source (think `src`): what you read, edit and write back. Their
      `url` serves the file raw from `*.codepenusercontent.com`.
    - A build's `files` are the compiled output (think `dist`): what `preview_url` and a deployment
      serve. They exist only when the build succeeded. You never write them.

    ## Privacy and passwords

    Pens and Collections have one privacy setting, `access`: `Public` (listed on the site),
    `Private` (unlisted; anyone with the link can view), `Protected` (Pens only: private and needs a
    password) or `Collaborators` (Pens only: only collaborators can view). Anything but `Public`
    needs PRO; a Free account gets `403 FORBIDDEN`, never a silent fallback. `Protected` needs a
    password of at least 8 characters when a Pen is created, forked or switched to it. Passwords are
    write-only; no read returns them.

    ## Deleting and restoring

    Deleting a Pen or Collection moves it to the trash (Your Work → Deleted Items on the site),
    restorable for 3 days, after which it is gone. Deleting a Collection leaves its Pens untouched.
    Deleting does not give back a daily create. Deleting an Asset removes it from storage.

    ## Limits

    | Plan | Requests | Reads | Creates per day |
    | :--- | :--- | :--- | :--- |
    | Free | 100/hour | 1,000/day | 3 Pens (creates and forks together) and 3 Collections |
    | PRO (User or Team) | 3,000/hour | 10,000/day | 50 Pens and 50 Collections |

    Past a limit, requests answer `429 RATE_LIMITED` until the hour or day is up. Each day runs from
    the first request of that kind; rotating the key does not reset counters. A Team key counts
    against the Team, apart from its members' own keys. The daily create allowance counts creates,
    not Pens or Collections currently held.

    Other limits: pages hold at most 100 items; a JSON body is capped at 16 MB; a multipart request
    at 120 MB and one file in it at 30 MB (your plan's own limits apply on save); a write waits at
    most 75 seconds for its build; Asset filenames are unique among your Assets and cannot contain
    `/` or `\`.

    ## Specification extensions

    - `x-codepen-undocumented: true` marks a field the live API returns that the docs do not
      mention. It was observed in real responses, but CodePen has not committed to it.
    - `x-codepen-changelog: <url>` marks a field the docs do not mention yet but CodePen's
      changelog announced. The value links to the changelog entry. Such fields are treated as part
      of the contract.
    - `x-codepen-unverified: true` marks a documented shape that has not yet been seen in a live
      response (for example a field that was always empty), so its item type or nullability comes
      from the docs alone.
    - `x-codepen-multi-segment: true` marks a path parameter that spans several path segments, such
      as a file path with slashes. OpenAPI path templates cannot express that; send the path with
      its slashes unencoded.
  contact:
    name: CodePen Support
    url: https://codepen.io/support

externalDocs:
  description: CodePen API v2 docs
  url: https://blog.codepen.io/docs/api/api-v2/

servers:
  - url: https://api.codepen.io/v2
    description: Production

security:
  - bearerAuth: []
  - apiKeyHeader: []

tags:
  - name: Pens
    description: Your Pens, their details and editor settings.
    externalDocs:
      url: https://blog.codepen.io/docs/api/api-v2/rest-api-v2/
  - name: Files
    description: |
      A Pen's source files in its saved head. Every write saves a new version and builds it. Files
      belong to 2.0 Pens; a Classic Pen's files can be read but not written.
  - name: Versions
    description: Saved versions of a 2.0 Pen. Each holds the source files and has one build.
  - name: Builds
    description: The compiler's run over a version. Poll a build while it is `Queued` or `Running`.
  - name: Deployments
    description: Deploying a version to the Pen's public URL, and taking it down.
  - name: Collaborators
    description: People who can edit or view a Pen, and pending invitations.
  - name: Collections
    description: Your Collections and the Pens in them.
  - name: Assets
    description: Files in your Asset Hosting. Assets belong to no Pen, so writing one makes no version and no build.

paths:
  /pens:
    get:
      operationId: listPens
      tags: [Pens]
      summary: List your Pens
      description: |
        Your Pens, paged and filterable. Every filter given must match. Each Pen carries its saved
        head without files.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortWithPopularity'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/AccessFilter'
        - $ref: '#/components/parameters/DeployedFilter'
        - $ref: '#/components/parameters/TemplateFilter'
        - $ref: '#/components/parameters/ForksFilter'
        - $ref: '#/components/parameters/EditorFilter'
        - $ref: '#/components/parameters/TagsFilter'
        - $ref: '#/components/parameters/SearchTermFilter'
      responses:
        '200':
          description: One page of Pens.
          headers:
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pen'
              examples:
                pens:
                  $ref: '#/components/examples/PenList'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      operationId: createPen
      tags: [Pens]
      summary: Create a 2.0 Pen
      description: |
        Creates a 2.0 Pen and builds it. Without `files` the Pen gets starter files. `title` defaults
        to "Untitled" and `access` to the account's default privacy. Counts against the daily Pen
        create allowance, shared with forks.

        The new Pen is built like any other write, so its files may be more than the files sent. The
        response is the Pen plus a top-level `build`: the build of its newest version.
      parameters:
        - $ref: '#/components/parameters/Wait'
      requestBody:
        $ref: '#/components/requestBodies/PenCreate'
      responses:
        '201':
          description: The new Pen, with the build of its newest version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenWithBuild'
              examples:
                created:
                  $ref: '#/components/examples/PenWithBuild'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /pens/{id}:
    parameters:
      - $ref: '#/components/parameters/PenId'
    get:
      operationId: getPen
      tags: [Pens]
      summary: Get one Pen
      responses:
        '200':
          description: The Pen. `saved_version` carries no files; read them from `GET /pens/{id}/files`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pen'
              examples:
                v2:
                  $ref: '#/components/examples/Pen'
                classic:
                  $ref: '#/components/examples/ClassicPen'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    patch:
      operationId: updatePen
      tags: [Pens]
      summary: Update a Pen's details
      description: |
        Changes only the keys given; `tags` replaces the whole list. These details are not files, so
        the update makes no version and no build.

        On a Pen that is already `Protected`, `password` alone replaces the password. A `password`
        with any `access` other than `Protected` answers 400.
      requestBody:
        $ref: '#/components/requestBodies/PenUpdate'
      responses:
        '200':
          description: The updated Pen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pen'
              examples:
                updated:
                  $ref: '#/components/examples/Pen'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: deletePen
      tags: [Pens]
      summary: Move a Pen to the trash
      description: |
        Moves the Pen to the trash. It is listed under Deleted Items on the site and can be restored
        there for 3 days, after which it is gone. Does not give back a daily create.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /pens/{id}/fork:
    parameters:
      - $ref: '#/components/parameters/PenId'
    post:
      operationId: forkPen
      tags: [Pens]
      summary: Fork one of your 2.0 Pens
      description: |
        Copies one of your 2.0 Pens and builds the copy. The copy keeps the original's title,
        description, tags and access unless given. A fork of a `Protected` Pen is `Protected` too, so
        it needs a `password`. Counts against the daily Pen create allowance, shared with creates.
      parameters:
        - $ref: '#/components/parameters/Wait'
      requestBody:
        $ref: '#/components/requestBodies/PenFork'
      responses:
        '201':
          description: The new Pen, with the build of its newest version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenWithBuild'
              examples:
                forked:
                  $ref: '#/components/examples/PenWithBuild'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /pens/{id}/settings:
    parameters:
      - $ref: '#/components/parameters/PenId'
    patch:
      operationId: updatePenSettings
      tags: [Pens]
      summary: Update a Pen's editor settings
      description: Changes only the keys given. Makes no version and no build.
      requestBody:
        $ref: '#/components/requestBodies/PenSettingsUpdate'
      responses:
        '200':
          description: The Pen's settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenSettings'
              examples:
                settings:
                  $ref: '#/components/examples/PenSettings'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /pens/{id}/files:
    parameters:
      - $ref: '#/components/parameters/PenId'
    get:
      operationId: listPenFiles
      tags: [Files]
      summary: List the saved head's files
      description: |
        Every source file in the Pen's saved head, with content. Not paged. For a Classic Pen these
        are its panels as files, built on read, with `url` null.
      responses:
        '200':
          description: The files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
              examples:
                files:
                  $ref: '#/components/examples/FileList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      operationId: writePenFiles
      tags: [Files]
      summary: Apply several file changes as one version
      description: |
        Applies a list of file changes, in order, as one new version and builds it. Each change
        writes, moves or deletes one file (or every file under a directory). Binary files go up as
        parts of a multipart request, each one more change applied after those in `changes`.

        The response is the newest version the write produced, with its source files, and that
        version's build. See *Writes and builds* above before writing again.
      parameters:
        - $ref: '#/components/parameters/Wait'
      requestBody:
        $ref: '#/components/requestBodies/FilesWrite'
      responses:
        '200':
          $ref: '#/components/responses/WriteResult'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /pens/{id}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/PenId'
      - $ref: '#/components/parameters/FilePath'
    get:
      operationId: getPenFile
      tags: [Files]
      summary: Get one file
      description: One file from the saved head, with `content` (null for binary files) and `url`.
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
              examples:
                text:
                  $ref: '#/components/examples/FileText'
                binary:
                  $ref: '#/components/examples/FileBinary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      operationId: writePenFile
      tags: [Files]
      summary: Write one file
      description: |
        Writes the file at `path`, creating it if needed: text as JSON `content`, or any file as a
        multipart part named `file`. Saves a new version and builds it.
      parameters:
        - $ref: '#/components/parameters/Wait'
      requestBody:
        $ref: '#/components/requestBodies/FileWrite'
      responses:
        '200':
          $ref: '#/components/responses/WriteResult'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: deletePenFile
      tags: [Files]
      summary: Delete one file or a directory
      description: |
        Deletes the file at `path`, or every file under it when `path` is a directory. Saves a new
        version and builds it, so it answers like any other write rather than 204.
      parameters:
        - $ref: '#/components/parameters/ExpectedVersionId'
        - $ref: '#/components/parameters/Wait'
      responses:
        '200':
          $ref: '#/components/responses/WriteResult'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /pens/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/PenId'
    get:
      operationId: listPenVersions
      tags: [Versions]
      summary: List a Pen's saved versions
      description: Saved versions, paged, each with its build. Files are left out; 2.0 Pens only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: One page of versions.
          headers:
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'
              examples:
                versions:
                  $ref: '#/components/examples/VersionList'
        '400':
          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /pens/{id}/versions/{version_id}/restore:
    parameters:
      - $ref: '#/components/parameters/PenId'
      - $ref: '#/components/parameters/RestoreVersionId'
    post:
      operationId: restorePenVersion
      tags: [Versions]
      summary: Restore an older version to the head
      description: |
        Copies an older version to the head. The one write that does not build: the restored version
        keeps the build of the version it copied.
      responses:
        '200':
          description: The Pen, whose `saved_version` is the new head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pen'
              examples:
                restored:
                  $ref: '#/components/examples/Pen'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /versions/{id}:
    parameters:
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getVersion
      tags: [Versions]
      summary: Get one version with its files
      description: |
        One version with its source files and its build, including the build's compiled output when
        the build succeeded.
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDetail'
              examples:
                version:
                  $ref: '#/components/examples/VersionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /builds/{id}:
    parameters:
      - $ref: '#/components/parameters/BuildId'
    get:
      operationId: getBuild
      tags: [Builds]
      summary: Get a build
      description: |
        A version's build, by the version's ID. Poll it while `status` is `Queued` or `Running`, and
        follow `next_id` when it is `Canceled` with one; that next build answers `Running` until its
        version is saved. Includes the compiled output when the build succeeded.
      responses:
        '200':
          description: The build.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildDetail'
              examples:
                success:
                  $ref: '#/components/examples/BuildSuccess'
                queued:
                  $ref: '#/components/examples/BuildQueued'
                canceledWithNext:
                  $ref: '#/components/examples/BuildCanceled'
                patched:
                  $ref: '#/components/examples/BuildPatched'
                failed:
                  $ref: '#/components/examples/BuildFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

