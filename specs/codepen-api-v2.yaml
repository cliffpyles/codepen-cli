      additionalProperties: false
    PenCreateRequest:
      type: object
      properties:
        title:
          type: string
          default: Untitled
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        access:
          $ref: '#/components/schemas/PenAccess'
        password:
          type: string
          writeOnly: true
          minLength: 8
          description: Required with `Protected` access, and refused with any other.
        template:
          type: boolean
        files:
          type: array
          description: Starter files when omitted.
          items:
            $ref: '#/components/schemas/PenFileRequest'
        wait:
          $ref: '#/components/schemas/Wait'
      additionalProperties: false
    PenUpdateRequest:
      type: object
