        wait:
          $ref: '#/components/schemas/Wait'
      additionalProperties: false
    Wait:
      type: integer
      description: Seconds to wait for the build (default 45, at most 75; `0` answers
        as soon as the files are saved).
      minimum: 0
      maximum: 75
    FilesWriteRequest:
      type: object
      properties:
        expected_version_id:
          type: string
          description: |
            The `saved_version.id` the change was built on. The write is refused
            with `409` if the Pen's head has moved since.
        wait:
          $ref: '#/components/schemas/Wait'
        dry_run:
          type: boolean
          default: false
          description: |
            Build the proposed files without saving them. The head does not
            move, and the answer's `version` has `saved: false`; it stays
            readable at `GET /v2/versions/{id}` for 36 hours.
        files:
          type: array
          items:
