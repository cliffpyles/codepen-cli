        - is_binary
        - created_at
        - updated_at
        - content
      properties:
        id:
          type: string
        filename:
          type: string
        url:
          type: string
          format: uri
        is_binary:
          type: boolean
          description: |
            Text Assets are those with a text extension: SVG,
            HTML/HAML/Pug/Slim/Markdown, CSS/Sass/SCSS/Less/Stylus,
            JS/JSX/TS/TSX/CoffeeScript/JSON/source maps, Vue, GLSL and plain
            text. Everything else is binary.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        content:
          type:
            - string
            - 'null'
          description: A text Asset's content; null for a binary one, whose bytes are
            served at `url`.
      additionalProperties: false
    TrashItem:
      type: object
      required:
