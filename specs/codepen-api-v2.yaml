    get:
      operationId: getAsset
      tags: [Assets]
      summary: Get one Asset
      description: |
        One Asset, with `content` for text files (SVG, HTML, CSS, Sass, JS, TS, JSON, Markdown,
        plain text and similar). `content` is null for binary files, whose bytes are at `url`.
      responses:
        '200':
