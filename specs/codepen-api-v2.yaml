          $ref: '#/components/responses/BadUserInput'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: deleteAsset
      tags: [Assets]
      summary: Delete an Asset
      description: Deletes the Asset from storage. Unlike Pens and Collections, it does not go to a trash.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: CodePen API key (cp_user_… or cp_team_…)
      description: |
        `Authorization: Bearer <key>`. Generate the key in Settings → API on codepen.io. A User's key
        starts with `cp_user_`; a Team's with `cp_team_`. Treat it like a password: it reads and
        changes everything its owner has, private work included. A missing or invalid key, or the key
        of a Team that is not PRO, answers 401.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: The same key in an `X-API-Key` header, for tooling where a Bearer header is awkward.

  parameters:
    PenId:
      name: id
      in: path
      required: true
      description: The Pen's cpid (2.0 Pens) or hashid (Classic Pens). Either works for any Pen.
      schema:
        $ref: '#/components/schemas/PenId'
      example: 01a08738-73f0-7847-b6a8-5789d289c158
    CollectionPenId:
      name: pen_id
      in: path
      required: true
      description: The Pen's cpid or hashid.
      schema:
        $ref: '#/components/schemas/PenId'
      example: 01a08738-73f0-7847-b6a8-5789d289c158
    VersionId:
      name: id
      in: path
      required: true
      description: The version's cpid.
      schema:
        $ref: '#/components/schemas/VersionId'
      example: 01a08738-73f0-7848-b8bf-e8e7e91b1ae2
    RestoreVersionId:
      name: version_id
      in: path
      required: true
      description: The cpid of the version to copy to the head.
      schema:
        $ref: '#/components/schemas/VersionId'
      example: 01a08738-73f0-7848-b8bf-e8e7e91b1ae2
    BuildId:
      name: id
      in: path
      required: true
      description: The ID of the version the build belongs to; a version and its build share one ID.
      schema:
        $ref: '#/components/schemas/VersionId'
      example: 01a08853-f1ab-7967-812e-eda134bd9e61
    CollectionId:
      name: id
      in: path
      required: true
      description: The Collection's hashid, the ID in `codepen.io/collection/<id>`.
      schema:
        $ref: '#/components/schemas/HashId'
      example: QbaoZL
    AssetId:
      name: id
      in: path
      required: true
      description: The Asset's hashid.
      schema:
        $ref: '#/components/schemas/HashId'
      example: k7Ym0R
    Username:
      name: username
      in: path
      required: true
      description: The collaborator's CodePen username.
      schema:
        type: string
        minLength: 1
      example: teammate
    FilePath:
      name: path
      in: path
      required: true
      description: |
        The file's full path inside the Pen without its leading `/`, slashes included and
        unencoded: `/pens/{id}/files/src/app.js` addresses `/src/app.js`. On a delete, a directory
        path addresses every file under it.
      schema:
        type: string
        minLength: 1
      example: src/app.js
      x-codepen-multi-segment: true
    ExpectedVersionId:
      name: expected_version_id
      in: query
      required: false
      description: |
        The `saved_version.id` the change was based on. If the Pen's head has moved since, the write
        is refused with 409 CONFLICT.
      schema:
        $ref: '#/components/schemas/VersionId'
    Wait:
      name: wait
      in: query
      required: false
      description: |
        Seconds to wait for the write's build before answering: 0 answers as soon as the files are
        saved. The build carries on either way. May also be sent as `wait` in a JSON body; on a
        multipart request, use this query parameter.
      schema:
        $ref: '#/components/schemas/Wait'
    Page:
      name: page
      in: query
      required: false
      description: The page to return, starting at 1. Prefer following the `Link` header to building page URLs.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    Sort:
      name: sort
      in: query
      required: false
      description: The field to sort by.
      schema:
        type: string
        enum: [created, updated]
        default: created
    SortWithPopularity:
      name: sort
      in: query
      required: false
      description: The field to sort by.
      schema:
        type: string
        enum: [created, updated, popularity]
        default: created
    Direction:
      name: direction
      in: query
      required: false
      description: Sort direction. The default puts the newest first.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    AccessFilter:
      name: access
      in: query
      required: false
      description: Only Pens with one of these privacy settings. Comma-separated.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/components/schemas/PenAccess'
      example: [Public, Private]
    CollectionAccessFilter:
      name: access
      in: query
      required: false
      description: Only Collections with one of these privacy settings. Comma-separated.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/components/schemas/CollectionAccess'
      example: [Public]
    DeployedFilter:
      name: deployed
      in: query
      required: false
      description: Only deployed (`true`) or undeployed (`false`) Pens.
      schema:
        type: boolean
    TemplateFilter:
      name: template
      in: query
      required: false
      description: Only templates (`true`) or non-templates (`false`).
      schema:
        type: boolean
    ForksFilter:
      name: forks
      in: query
      required: false
      description: Whether to include forks, only forks, or no forks.
      schema:
        type: string
        enum: [All, Forked, NotForked]
        default: All
    EditorFilter:
      name: editor
      in: query
      required: false
      description: Only Pens made in this editor.
      schema:
        $ref: '#/components/schemas/Editor'
    TagsFilter:
      name: tags
      in: query
      required: false
      description: |
        Pens tagged with any of these, comma-separated. Tags match the way they are saved:
        lowercased, spaces as dashes, punctuation dropped (`Two Words!` is `two-words`).
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 3
        items:
          type: string
          minLength: 1
      example: [gsap, svg]
    SearchTermFilter:
      name: search_term
      in: query
      required: false
      description: |
        Matches the title or description, in the site's search syntax: every word has to appear,
        `"quoted words"` stay together, and `-word` excludes one.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: cards

  headers:
    Link:
      description: |
        Links to the other pages, like GitHub's REST API. `rel="first"` and `rel="last"` are always
        present (`last` counts under the request's own filters); `rel="prev"` is absent on the first
        page and `rel="next"` on the last. Follow these URLs rather than building your own; they keep
        the request's other query parameters.
      required: true
      schema:
        type: string
      example: >-
        <https://api.codepen.io/v2/pens?page=1&per_page=30>; rel="prev",
        <https://api.codepen.io/v2/pens?page=3&per_page=30>; rel="next",
        <https://api.codepen.io/v2/pens?page=1&per_page=30>; rel="first",
        <https://api.codepen.io/v2/pens?page=21&per_page=30>; rel="last"

  responses:
    NoContent:
      description: Done. No body.
    WriteResult:
      description: |
        The write was saved. `version` is the newest version it produced, with its source files;
        `build` is that version's build, with the compiled output when it succeeded. A build that
        `Failed` is still a 200: the files are saved and `build.errors` say why they do not build.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WriteResult'
          examples:
            settled:
              $ref: '#/components/examples/WriteResult'
            notWaited:
              $ref: '#/components/examples/WriteResultQueued'
    BadUserInput:
      description: |
        BAD_USER_INPUT: an invalid path, setting, access level or role; empty content; both content
        and an upload for one file; an empty multipart part; a password with an access other than
        Protected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadUserInputError'
          examples:
            error:
              $ref: '#/components/examples/BadUserInputError'
    Unauthenticated:
      description: UNAUTHENTICATED. The key is missing or invalid, or its Team is not PRO. Do not retry; check the header or rotate the key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedError'
          examples:
            error:
              $ref: '#/components/examples/UnauthenticatedError'
    Forbidden:
      description: |
        FORBIDDEN: a write to a Classic Pen, or a plan limit (file count, file size, storage,
        non-Public Pens or Collections, collaborator invites). When a bigger plan lifts the limit, the
        message says so and links to pricing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
          examples:
            classic:
              $ref: '#/components/examples/ForbiddenClassicError'
            plan:
              $ref: '#/components/examples/ForbiddenPlanError'
    NotFound:
      description: |
        NOT_FOUND: no Pen, Collection, version, build, file, Asset or deployment with that ID, or one
        that is not the key owner's. Other people's work answers this too, even when public.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
          examples:
            error:
              $ref: '#/components/examples/NotFoundError'
    Conflict:
      description: |
        CONFLICT: `expected_version_id` is no longer the Pen's head. Read the files again and retry
        from `current_version_id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
          examples:
            error:
              $ref: '#/components/examples/ConflictError'
    RateLimited:
      description: |
        RATE_LIMITED: over the hourly request limit, the daily read limit, or today's allowance of
        Pens or Collections. Wait for the hour or day to pass; retrying sooner only fails again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedError'
          examples:
            error:
              $ref: '#/components/examples/RateLimitedError'
    Internal:
      description: INTERNAL. Something unexpected on CodePen's end; they are notified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          examples:
            error:
              $ref: '#/components/examples/InternalError'

  requestBodies:
    PenCreate:
      required: false
      description: |
        JSON, or a multipart form when uploading binary files. In the form, `pen` carries the JSON
        body and every other part is one file, named by its path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PenCreate'
          examples:
            withFiles:
              $ref: '#/components/examples/PenCreateRequest'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/PenCreateMultipart'
          encoding:
            pen:
              contentType: application/json
    PenUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PenUpdate'
          examples:
            details:
              $ref: '#/components/examples/PenUpdateRequest'
            protect:
              $ref: '#/components/examples/PenProtectRequest'
    PenFork:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PenFork'
          examples:
            retitle:
              $ref: '#/components/examples/PenForkRequest'
    PenSettingsUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PenSettingsUpdate'
          examples:
            tabs:
              $ref: '#/components/examples/PenSettingsUpdateRequest'
    FilesWrite:
      required: true
      description: |
        JSON, or a multipart form when uploading binary files. In the form, `changes` carries the
        JSON body; every other part is one file, named by its path, and is one more change applied
        after those in `changes`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FilesWrite'
          examples:
            moveWriteDelete:
              $ref: '#/components/examples/FilesWriteRequest'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/FilesWriteMultipart'
          encoding:
            changes:
              contentType: application/json
    FileWrite:
      required: true
      description: JSON `content` for text, or a multipart part named `file` for any file.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileWrite'
          examples:
            text:
              $ref: '#/components/examples/FileWriteRequest'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/FileWriteMultipart'
    Deploy:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Deploy'
          examples:
            head:
              summary: Deploy the saved head
              value: {}
    CollaboratorInvite:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CollaboratorInvite'
          examples:
            editor:
              $ref: '#/components/examples/CollaboratorInviteRequest'
    CollaboratorUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CollaboratorUpdate'
          examples:
            viewer:
              summary: Make a collaborator a Viewer
              value:
                role: Viewer
    CollectionCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CollectionCreate'
          examples:
            public:
              summary: A public Collection
              value:
                title: Demos
                access: Public
    CollectionUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CollectionUpdate'
          examples:
            rename:
              summary: Rename and describe
              value:
                title: Demos and experiments
                description: Small things that worked.
    AssetCreate:
      required: true
      description: A multipart part named `file`, or for text, JSON `filename` and `content`.
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/AssetCreateMultipart'
        application/json:
          schema:
            $ref: '#/components/schemas/AssetCreate'
          examples:
            text:
              summary: A text Asset as JSON
              value:
                filename: theme.css
                content: 'body { color: red }'
    AssetUpdate:
      required: true
      description: A new `filename`, new content, or both. Content goes as JSON `content` or a multipart part named `file`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssetUpdate'
          examples:
            rename:
              summary: Rename
              value:
                filename: theme-dark.css
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/AssetUpdateMultipart'

  schemas:
    # ── Scalars ────────────────────────────────────────────────────────────────────────────

    PenId:
      type: string
      minLength: 1
      description: A Pen's cpid (2.0 Pens, a UUID) or hashid (Classic Pens, the slug in its URL).
      examples: [01a08738-73f0-7847-b6a8-5789d289c158, RNprEMR]
    VersionId:
      type: string
      format: uuid
      description: A version's cpid, which is also its build's ID.
      examples: [01a08738-73f0-7848-b8bf-e8e7e91b1ae2]
    FileId:
      type: string
      format: uuid
      description: A file's stable ID. It survives renames and edits.
      examples: [01a0884b-3177-71c3-a1c2-9452bfb9a3fb]
    HashId:
      type: string
      pattern: '^[A-Za-z0-9]+$'
      description: A short alphanumeric ID, as used for Collections, Assets and deployments.
      examples: [QbaoZL]
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 in UTC. The fraction of a second varies in length and may be absent.
      examples: ['2026-09-09T22:23:39Z', '2026-10-16T00:57:11.38331Z']
    Wait:
      type: integer
      minimum: 0
      maximum: 75
      default: 45
      description: Seconds a write waits for its build before answering; 0 answers as soon as the files are saved.
    Tags:
      type: array
      description: Tags, saved lowercased with spaces as dashes and punctuation dropped.
      items:
        type: string
      examples: [[api, demo]]
    Password:
      type: string
      minLength: 8
      writeOnly: true
      description: |
        The password for a Protected Pen, at least 8 characters. Write-only. Sent with any access
        but `Protected` (and not on a Pen that already is) it answers 400.
    AssetFilename:
      type: string
      minLength: 1
      pattern: "^[^/\\\\]+$"
      description: Unique among your Assets; cannot contain `/` or `\`.
      examples: [logo.png]
    BinaryPart:
      type: string
      format: binary
      contentMediaType: application/octet-stream
      description: A file uploaded as one part of a multipart form. At most 30 MB per file, 120 MB per request.

    # ── Enums ──────────────────────────────────────────────────────────────────────────────

    PenAccess:
      type: string
      enum: [Public, Private, Protected, Collaborators]
      description: |
        `Public`: listed on the site. `Private`: unlisted; anyone with the link can view.
        `Protected`: private, and viewing needs a password. `Collaborators`: private, and only
        collaborators can view. Anything but Public needs PRO. Accepted in any case.
    CollectionAccess:
      type: string
      enum: [Public, Private]
      description: Collections are Public or Private. Private needs PRO. Accepted in any case.
    Editor:
      type: string
      enum: [V2, Classic]
      description: The editor that made the Pen. `Classic` Pens are read-only through the API.
    Role:
      type: string
      enum: [Owner, Editor, Viewer]
      description: A collaborator's role on a Pen.
    InviteRole:
      type: string
      enum: [Editor, Viewer]
      description: A role that can be given to a collaborator. Accepted in any case.
    IndentWith:
      type: string
      enum: [spaces, tabs]
    BuildStatus:
      type: string
      enum: [Queued, Running, Success, Failed, Canceled]
      description: |
        `Queued`, `Running`: not done, keep polling. `Success`: done, with output files. `Failed`:
        done with errors; the files are saved and nothing is retried. `Canceled`: the compiler asked
        for changes; follow `next_id` if set, otherwise `patches` lists what is still required.
    DiagnosticType:
      type: string
      enum: [Error, Warning, Information, Hint]
    DiagnosticScope:
      type: string
      enum: [Build, BuildStep, File]
      description: '`Build`: about the whole build. `BuildStep`: about one step of it. `File`: about one file.'
    PatchType:
      type: string
      enum: [create, update, delete]
    ErrorCode:
      type: string
      enum:
        [UNAUTHENTICATED, RATE_LIMITED, NOT_FOUND, FORBIDDEN, BAD_USER_INPUT, CONFLICT, INTERNAL]
      description: Shared with the GraphQL API, where it is `errors[].extensions.code`.

    # ── Pens ───────────────────────────────────────────────────────────────────────────────

    PenBase:
      type: object
      description: The fields every Pen response has. Not used on its own; see Pen and PenWithBuild.
      required:
        [
          id,
          title,
          description,
          tags,
          access,
          password,
          template,
          popularity,
          loves_count,
          views_count,
          editor,
          created_at,
          updated_at,
          urls,
          screenshot_urls,
          saved_version,
          deployment,
          settings,
        ]
      properties:
        id:
          $ref: '#/components/schemas/PenId'
        title:
          type: string
        description:
          type: string
        tags:
          $ref: '#/components/schemas/Tags'
        access:
          $ref: '#/components/schemas/PenAccess'
        password:
          type: 'null'
          description: Write-only, so always null.
        template:
          type: boolean
          description: Whether the Pen is a template.
        popularity:
          type: integer
          minimum: 0
        loves_count:
          type: integer
          minimum: 0
          description: How many times the Pen has been loved.
          x-codepen-changelog: https://codepen.io/changelog#2026-10-16
        views_count:
          type: integer
          minimum: 0
          description: How many times the Pen has been viewed.
          x-codepen-changelog: https://codepen.io/changelog#2026-10-16
        editor:
          $ref: '#/components/schemas/Editor'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        urls:
          $ref: '#/components/schemas/PenUrls'
        screenshot_urls:
          description: Null for a 2.0 Pen with no saved version.
          oneOf:
            - $ref: '#/components/schemas/ScreenshotUrls'
            - type: 'null'
        saved_version:
          description: The saved head, without files. Null for Classic Pens.
          oneOf:
            - $ref: '#/components/schemas/Version'
            - type: 'null'
        deployment:
          description: The current deployment, or null when the Pen is not deployed.
          oneOf:
            - $ref: '#/components/schemas/Deployment'
            - type: 'null'
        settings:
          $ref: '#/components/schemas/PenSettings'
    Pen:
      description: A Pen. `id` is the cpid for 2.0 Pens and the hashid for Classic Pens.
      allOf:
        - $ref: '#/components/schemas/PenBase'
      unevaluatedProperties: false
    PenWithBuild:
      description: A Pen just made by a create or fork, with the build of its newest version.
      allOf:
        - $ref: '#/components/schemas/PenBase'
        - type: object
          required: [build]
          properties:
            build:
              $ref: '#/components/schemas/BuildDetail'
      unevaluatedProperties: false
    PenUrls:
      type: object
      required: [editor, preview]
      properties:
        editor:
          type: string
          format: uri
          description: The Pen in the editor.
        preview:
          type: string
          format: uri
          description: |
            The saved head rendered on its own. 404s for Protected and Collaborators Pens, which need
            a browser session. A deployed Pen's public URL is `deployment.url`.
      additionalProperties: false
    ScreenshotUrls:
      type: object
      description: |
        JPEG screenshots of the saved head, 16:9, by width. Rendered on first request, so the first
        fetch can take a few seconds. Protected and Collaborators Pens answer a not-found image.
      required: [small, medium, large, xlarge]
      properties:
        small:
          type: string
          format: uri
          description: 320 pixels wide.
        medium:
          type: string
          format: uri
          description: 512 pixels wide.
        large:
          type: string
          format: uri
          description: 800 pixels wide.
        xlarge:
          type: string
          format: uri
          description: 1280 pixels wide.
      additionalProperties: false
    PenSettingsFields:
      type: object
      description: The editor settings' fields. Not used on its own; see PenSettings and PenSettingsUpdate.
      properties:
        auto_deploy:
          type: boolean
          description: Deploy every new saved version automatically.
        auto_run:
          type: boolean
          description: Rerun the preview as code changes.
        auto_save:
          type: boolean
          description: Save in the editor as you type.
        indent_with:
          $ref: '#/components/schemas/IndentWith'
        tab_size:
          type: integer
          minimum: 1
    PenSettings:
      description: A Pen's editor settings.
      allOf:
        - $ref: '#/components/schemas/PenSettingsFields'
      required: [auto_deploy, auto_run, auto_save, indent_with, tab_size]
      unevaluatedProperties: false
    Deployment:
      type: object
      required: [id, version_id, url, custom_domains, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        version_id:
          $ref: '#/components/schemas/VersionId'
        url:
          type: string
          format: uri
          description: The deployed Pen's public URL on `codepen.app`.
        custom_domains:
          type: array
          description: Custom domains serving the deployment.
          items:
            type: string
          x-codepen-unverified: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false

    # ── Files ──────────────────────────────────────────────────────────────────────────────

    File:
      type: object
      description: |
        A source file (in a version) or an output file (in a build). Output files' `url` is under
        the version's `preview_url`.
      required: [id, path, name, content_hash, is_binary, content, url]
      properties:
        id:
          $ref: '#/components/schemas/FileId'
        path:
          type: string
          pattern: '^/'
          description: The full path, starting with `/`.
          examples: [/src/app.js]
        name:
          type: string
          description: The last segment of `path`.
          examples: [app.js]
        content_hash:
          type: string
          description: Derived by the API; never sent.
        is_binary:
          type: boolean
        content:
          type: [string, 'null']
          description: The text. Null for binary files, whose bytes are at `url`.
        url:
          type: [string, 'null']
          format: uri
          description: Serves the file raw. Null for a Classic Pen's files, which are built on read.
      additionalProperties: false

    # ── Versions ───────────────────────────────────────────────────────────────────────────

    VersionBase:
      type: object
      description: The fields every version has. Not used on its own; see Version and VersionDetail.
      required: [id, pen_id, hash, created_at, deployed, preview_url]
      properties:
        id:
          $ref: '#/components/schemas/VersionId'
        pen_id:
          $ref: '#/components/schemas/PenId'
        hash:
          type: string
          description: Derived by the API from the version's files.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        deployed:
          type: boolean
          description: Whether this version is the deployed one.
        preview_url:
          type: string
          format: uri
          description: Serves this version's build output.
    Version:
      description: A saved version without files, as in lists and `saved_version`.
      allOf:
        - $ref: '#/components/schemas/VersionBase'
        - type: object
          required: [build]
          properties:
            build:
              $ref: '#/components/schemas/Build'
      unevaluatedProperties: false
    VersionDetail:
      description: A version with its source files, and its build with the compiled output.
      allOf:
        - $ref: '#/components/schemas/VersionBase'
        - type: object
          required: [build, files]
          properties:
            build:
              $ref: '#/components/schemas/BuildDetail'
            files:
              type: array
              description: The version's source files.
              items:
                $ref: '#/components/schemas/File'
      unevaluatedProperties: false

    # ── Builds ─────────────────────────────────────────────────────────────────────────────

    BuildBase:
      type: object
      description: The fields every build has. Not used on its own; see Build and BuildDetail.
      required:
        [
          id,
          status,
          started_at,
          ended_at,
          rounds,
          diagnostics,
          errors,
          applied_patches,
          patches,
          version_id,
          next_id,
          previous_id,
        ]
      properties:
        id:
          $ref: '#/components/schemas/VersionId'
        status:
          $ref: '#/components/schemas/BuildStatus'
        started_at:
          description: Null before the build starts, and on some older builds.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        ended_at:
          description: Null until the build ends, and on some older builds.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        rounds:
          type: integer
          minimum: 1
          maximum: 5
          description: Compiler builds it took to get here, counted from the version written. 1 when no changes were needed.
        diagnostics:
          type: array
          description: Everything the final build reported.
          items:
            $ref: '#/components/schemas/Diagnostic'
        errors:
          type: array
          description: The diagnostics whose type is Error, as a shortcut.
          items:
            $ref: '#/components/schemas/Diagnostic'
        applied_patches:
          type: array
          description: Changes the API made to the files for the compiler. The version's files already include them.
          items:
            $ref: '#/components/schemas/Patch'
        patches:
          type: array
          description: Changes the compiler still requires. Empty unless status is Canceled.
          items:
            $ref: '#/components/schemas/Patch'
        version_id:
          description: The version the build belongs to. Null while that version is still being put together.
          oneOf:
            - $ref: '#/components/schemas/VersionId'
            - type: 'null'
        next_id:
          description: Set on a Canceled build while the API applies the compiler's changes; poll that build next.
          oneOf:
            - $ref: '#/components/schemas/VersionId'
            - type: 'null'
        previous_id:
          description: On the patched version's build, the version that was written.
          oneOf:
            - $ref: '#/components/schemas/VersionId'
            - type: 'null'
    Build:
      description: A build without its output files, as in lists and `saved_version`.
      allOf:
        - $ref: '#/components/schemas/BuildBase'
      unevaluatedProperties: false
    BuildDetail:
      description: A build with its compiled output, which is present only when the build succeeded.
      allOf:
        - $ref: '#/components/schemas/BuildBase'
        - type: object
          properties:
            files:
              type: array
              description: The compiled output. Present only when status is Success.
              items:
                $ref: '#/components/schemas/File'
      unevaluatedProperties: false
    Diagnostic:
      type: object
      required: [type, scope, message, code, url, block_name, path, file_id, range]
      properties:
        type:
          $ref: '#/components/schemas/DiagnosticType'
        scope:
          $ref: '#/components/schemas/DiagnosticScope'
        message:
          type: string
        code:
          type: [string, 'null']
          description: The tool's own diagnostic code, such as a TypeScript error number.
          examples: ['2347']
        url:
          type: [string, 'null']
          format: uri
        block_name:
          type: [string, 'null']
          description: The compiler block that reported it.
          examples: [typescript-5]
        path:
          type: [string, 'null']
          description: |
            The Pen file it is about. A diagnostic about something outside the Pen's files can carry
            a compiler-side path instead, such as `/cpfs/pens/…/src`.
        file_id:
          description: |
            The file it is about, or null. A diagnostic about something outside the Pen's files (for
            example a `tsconfig.json` option the compiler rejects) can carry an empty string.
          oneOf:
            - $ref: '#/components/schemas/FileId'
            - type: 'null'
            - const: ''
              x-codepen-undocumented: true
        range:
          oneOf:
            - $ref: '#/components/schemas/DiagnosticRange'
            - type: 'null'
      additionalProperties: false
    DiagnosticRange:
      type: object
      required: [start, end]
      properties:
        start:
          $ref: '#/components/schemas/DiagnosticPosition'
        end:
          oneOf:
            - $ref: '#/components/schemas/DiagnosticPosition'
            - type: 'null'
      additionalProperties: false
    DiagnosticPosition:
      type: object
      required: [line, column]
      properties:
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        position:
          type: integer
          minimum: 0
          description: Character offset into the file.
          x-codepen-undocumented: true
      additionalProperties: false
    Patch:
      type: object
      description: |
        A change to the source files. `update` and `delete` carry the `file_id` of the file they
        change; `delete` has no content.
      required: [type, path, file_id]
      properties:
        type:
          $ref: '#/components/schemas/PatchType'
        path:
          type: string
        file_id:
          oneOf:
            - $ref: '#/components/schemas/FileId'
            - type: 'null'
        content:
          type: [string, 'null']
      additionalProperties: false
      x-codepen-unverified: true

    WriteResult:
      type: object
      description: The answer to every write of a Pen's files.
      required: [pen, version, build]
      properties:
        pen:
          $ref: '#/components/schemas/Pen'
        version:
          $ref: '#/components/schemas/VersionDetail'
        build:
          $ref: '#/components/schemas/BuildDetail'
      additionalProperties: false

    # ── Collaborators ──────────────────────────────────────────────────────────────────────

    Collaborator:
      type: object
      required: [username, name, role, is_team_member]
      properties:
        username:
          type: string
        name:
          type: string
          description: Display name.
        role:
          $ref: '#/components/schemas/Role'
        is_team_member:
          type: boolean
      additionalProperties: false
    CollaboratorList:
      type: array
      items:
        $ref: '#/components/schemas/Collaborator'
    Invite:
      type: object
      description: A pending invitation. One of `email` and `username` is set.
      required: [id, email, username, role, created_at]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        username:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/InviteRole'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      additionalProperties: false
      x-codepen-unverified: true
    InviteList:
      type: array
      items:
        $ref: '#/components/schemas/Invite'

    # ── Collections ────────────────────────────────────────────────────────────────────────

    Collection:
      type: object
      required:
        [id, title, description, access, items_count, popularity, created_at, updated_at, url]
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        title:
          type: string
        description:
          type: string
        access:
          $ref: '#/components/schemas/CollectionAccess'
        items_count:
          type: integer
          minimum: 0
          description: How many Pens the Collection holds.
        popularity:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        url:
          type: string
          format: uri
      additionalProperties: false

    # ── Assets ─────────────────────────────────────────────────────────────────────────────

    AssetBase:
      type: object
      description: The fields every Asset has. Not used on its own; see Asset and AssetDetail.
      required: [id, filename, url, is_binary, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        filename:
          $ref: '#/components/schemas/AssetFilename'
        url:
          type: string
          format: uri
          description: Where the file is served. Changes when the Asset is renamed.
        is_binary:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Asset:
      description: An Asset without content, as in lists and write responses.
      allOf:
        - $ref: '#/components/schemas/AssetBase'
      unevaluatedProperties: false
    AssetDetail:
      description: An Asset with `content` for text files.
      allOf:
        - $ref: '#/components/schemas/AssetBase'
        - type: object
          required: [content]
          properties:
            content:
              type: [string, 'null']
              description: The text of a text Asset; null for binary ones.
      unevaluatedProperties: false

    # ── Errors ─────────────────────────────────────────────────────────────────────────────

    Error:
      type: object
      description: Every error body. Not used on its own; each status has its own schema fixing `code`.
      required: [message, code]
      properties:
        message:
          type: string
          description: What went wrong. For plan limits, names the limit and links to pricing when a bigger plan lifts it.
        code:
          $ref: '#/components/schemas/ErrorCode'
    BadUserInputError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - required: [code]
          properties:
            code:
              const: BAD_USER_INPUT
      unevaluatedProperties: false
    UnauthenticatedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - required: [code]
          properties:
            code:
              const: UNAUTHENTICATED
      unevaluatedProperties: false
    ForbiddenError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - required: [code]
          properties:
            code:
              const: FORBIDDEN
      unevaluatedProperties: false
    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - required: [code]
          properties:
            code:
              const: NOT_FOUND
      unevaluatedProperties: false
    ConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code, expected_version_id, current_version_id]
          properties:
            code:
              const: CONFLICT
            expected_version_id:
              $ref: '#/components/schemas/VersionId'
            current_version_id:
              $ref: '#/components/schemas/VersionId'
      unevaluatedProperties: false
    RateLimitedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - required: [code]
          properties:
            code:
              const: RATE_LIMITED
      unevaluatedProperties: false
    InternalError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - required: [code]
          properties:
            code:
              const: INTERNAL
      unevaluatedProperties: false

    # ── Requests ───────────────────────────────────────────────────────────────────────────

    PenDetailsInput:
      type: object
      description: Details shared by creates, forks and updates. Not used on its own.
      properties:
        title:
          type: string
        description:
          type: string
        tags:
          $ref: '#/components/schemas/Tags'
        access:
          $ref: '#/components/schemas/PenAccess'
        password:
          $ref: '#/components/schemas/Password'
    PenCreate:
      description: |
        A new 2.0 Pen. `title` defaults to "Untitled", `access` to the account's default privacy,
        and `files` to starter files.
      allOf:
        - $ref: '#/components/schemas/PenDetailsInput'
        - type: object
          properties:
            files:
              type: array
              description: The Pen's initial text files. Binary files go as multipart parts.
              items:
                $ref: '#/components/schemas/FileWriteByPath'
            wait:
              $ref: '#/components/schemas/Wait'
      unevaluatedProperties: false
    PenCreateMultipart:
      type: object
      description: '`pen` is the JSON body; every other part is one file, named by its path (for example `/img/logo.png`).'
      properties:
        pen:
          $ref: '#/components/schemas/PenCreate'
      additionalProperties:
        $ref: '#/components/schemas/BinaryPart'
    PenFork:
      description: Overrides for the copy. Anything left out keeps the original's value.
      allOf:
        - $ref: '#/components/schemas/PenDetailsInput'
        - type: object
          properties:
            wait:
              $ref: '#/components/schemas/Wait'
      unevaluatedProperties: false
    PenUpdate:
      description: The details to change. Only the keys given change; `tags` replaces the whole list.
      allOf:
        - $ref: '#/components/schemas/PenDetailsInput'
        - type: object
          properties:
            template:
              type: boolean
              description: Whether the Pen is a template.
      minProperties: 1
      unevaluatedProperties: false
    PenSettingsUpdate:
      description: The settings to change.
      allOf:
        - $ref: '#/components/schemas/PenSettingsFields'
      minProperties: 1
      unevaluatedProperties: false

    FileChange:
      description: |
        One change in a multi-file write, addressing a file by `path` or by `id`. Changes apply in
        order. Paths get a leading `/` if missing.
      oneOf:
        - $ref: '#/components/schemas/FileWriteByPath'
        - $ref: '#/components/schemas/FileWriteById'
        - $ref: '#/components/schemas/FileMoveById'
        - $ref: '#/components/schemas/FileDeleteByPath'
        - $ref: '#/components/schemas/FileDeleteById'
    FileWriteByPath:
      type: object
      description: Writes the file at `path`, creating it if needed.
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          examples: [index.html]
        content:
          type: string
          minLength: 1
      additionalProperties: false
    FileWriteById:
      type: object
      description: Writes the file with that ID, wherever it is.
      required: [id, content]
      properties:
        id:
          $ref: '#/components/schemas/FileId'
        content:
          type: string
          minLength: 1
      additionalProperties: false
    FileMoveById:
      type: object
      description: Moves the file with that ID to `path`, keeping its ID. With `content`, writes it there too.
      required: [id, path]
      properties:
        id:
          $ref: '#/components/schemas/FileId'
        path:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
      additionalProperties: false
    FileDeleteByPath:
      type: object
      description: Deletes the file at `path`, or every file under it when it is a directory.
      required: [path, delete]
      properties:
        path:
          type: string
          minLength: 1
        delete:
          const: true
      additionalProperties: false
    FileDeleteById:
      type: object
      description: Deletes the file with that ID.
      required: [id, delete]
      properties:
        id:
          $ref: '#/components/schemas/FileId'
        delete:
          const: true
      additionalProperties: false
    FilesWrite:
      type: object
      required: [files]
      properties:
        expected_version_id:
          $ref: '#/components/schemas/VersionId'
        wait:
          $ref: '#/components/schemas/Wait'
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FileChange'
      additionalProperties: false
    FilesWriteMultipart:
      type: object
      description: |
        `changes` is the JSON body. Every other part is one file, named by its path, and is one more
        change applied after those in `changes`.
      properties:
        changes:
          $ref: '#/components/schemas/FilesWrite'
        expected_version_id:
          $ref: '#/components/schemas/VersionId'
      additionalProperties:
        $ref: '#/components/schemas/BinaryPart'
    FileWrite:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: The file's text.
        expected_version_id:
          $ref: '#/components/schemas/VersionId'
        wait:
          $ref: '#/components/schemas/Wait'
      additionalProperties: false
    FileWriteMultipart:
      type: object
      required: [file]
      properties:
        file:
          $ref: '#/components/schemas/BinaryPart'
        expected_version_id:
          $ref: '#/components/schemas/VersionId'
      additionalProperties: false

    Deploy:
      type: object
      properties:
        version_id:
          description: The version to deploy. Defaults to the saved head.
          allOf:
            - $ref: '#/components/schemas/VersionId'
      additionalProperties: false

    CollaboratorInvite:
      type: object
      required: [email_or_username, role]
      properties:
        email_or_username:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/InviteRole'
      additionalProperties: false
    CollaboratorUpdate:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/InviteRole'
      additionalProperties: false

    CollectionDetailsInput:
      type: object
      description: Details shared by Collection creates and updates. Not used on its own.
      properties:
        title:
          type: string
        description:
          type: string
        access:
          $ref: '#/components/schemas/CollectionAccess'
    CollectionCreate:
      allOf:
        - $ref: '#/components/schemas/CollectionDetailsInput'
      unevaluatedProperties: false
    CollectionUpdate:
      description: Only the keys given change.
      allOf:
        - $ref: '#/components/schemas/CollectionDetailsInput'
      minProperties: 1
      unevaluatedProperties: false

    AssetCreate:
      type: object
      description: A text Asset sent as JSON.
      required: [filename, content]
      properties:
        filename:
          $ref: '#/components/schemas/AssetFilename'
        content:
          type: string
          minLength: 1
      additionalProperties: false
    AssetCreateMultipart:
      type: object
      required: [file]
      properties:
        file:
          $ref: '#/components/schemas/BinaryPart'
        filename:
          description: Defaults to the part's own filename.
          allOf:
            - $ref: '#/components/schemas/AssetFilename'
      additionalProperties: false
    AssetUpdate:
      type: object
      minProperties: 1
      properties:
        filename:
          $ref: '#/components/schemas/AssetFilename'
        content:
          type: string
          minLength: 1
          description: New text content.
      additionalProperties: false
    AssetUpdateMultipart:
      type: object
      minProperties: 1
      properties:
        file:
          $ref: '#/components/schemas/BinaryPart'
        filename:
          $ref: '#/components/schemas/AssetFilename'
      additionalProperties: false

